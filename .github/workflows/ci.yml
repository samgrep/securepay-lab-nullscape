name: DevSecOps Pipeline

on:
  push:
  pull_request:

# Prinsip least privilege: workflow hanya boleh membaca isi repo
permissions:
  contents: read
# Versi tool di-pin + checksum diverifikasi.
# Kenapa? Supaya tool keamanan tidak bisa diganti diam-diam (lihat insiden supply chain Trivy, Maret 2026).
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.177.0"

jobs:
  # ------------------------------------------------------------
  # CI dasar: install -> unit test.  (sudah HIJAU dari awal)
  # Tugas Anda: menambahkan security check ke pipeline ini.
  # ------------------------------------------------------------
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      # Action di-pin ke commit SHA (bukan tag) agar tidak bisa diganti diam-diam
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PAYMENT_GATEWAY_API_KEY: ${{ secrets.PAYMENT_GATEWAY_API_KEY }}
        run: npm test

  # >>> TAHAP A: tambahkan job secret-scan di bawah ini
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Gitleaks (versi di-pin + verifikasi checksum)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan secret di source code
        run: gitleaks dir . --redact --verbose
  # >>> TAHAP B: tambahkan job dependency-scan
  dependency-scan:
    name: Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # Gagal jika ada vulnerability tingkat HIGH atau CRITICAL
      - run: npm audit --audit-level=high
  # >>> TAHAP C: tambahkan job sast
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
      - name: Jalankan SAST
        run: semgrep scan --config .semgrep/ --metrics=off --disable-version-check --error src

  # >>> TAHAP E: DAST (menjalankan aplikasi lalu menyerangnya dari luar)
  dast:
    name: DAST (OWASP ZAP)
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Jalankan aplikasi (secret acak, hanya untuk job ini)
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "PAYMENT_GATEWAY_API_KEY=dummy-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
      - name: Start app & tunggu siap
        run: |
          nohup npm start > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
          curl -sf http://localhost:3000/health
      - name: Ambil JWT user uji (agar endpoint terautentikasi ikut di-scan)
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:3000/api/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"budi","password":"budi123"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          echo "::add-mask::$TOKEN"
          echo "DAST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: ZAP scan (OpenAPI import + passive + active)
        run: |
          mkdir -p dast/report && chmod 777 dast/report
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/zap/wrk:rw" \
            -e DAST_TOKEN -e DAST_DIR=/zap/wrk/dast \
            "$ZAP_IMAGE" zap.sh -cmd -silent -autorun /zap/wrk/dast/zap-plan.yaml
      - name: Security gate DAST (gagal jika ada temuan Medium ke atas)
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("dast/report/zap-report.json"));
            let bad = 0;
            for (const s of r.site) for (const a of s.alerts) {
              console.log(`[${a.riskdesc}] ${a.name} (${a.instances.length} lokasi)`);
              if (Number(a.riskcode) >= 2) bad++;
            }
            if (bad) { console.error(`${bad} temuan Medium/High -> gate gagal`); process.exit(1); }
          '
      - name: Simpan laporan ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: dast/report/
            
  # >>> TAHAP D: tambahkan job deploy (security gate)
  deploy:
    name: Deploy ke Staging (simulasi)
    needs: [build-test, secret-scan, dependency-scan, sast, dast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Semua security gate lolos. Deploy ke staging (simulasi)."
